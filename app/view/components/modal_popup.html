<div id="choiceModal" class="modal">
    <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h3>Sign Up</h3>
        <p style="font-family:monospace;">Welcome! Sign Up for free.</p>

        <!-- JWT Auth form -->
        <form id="authForm" method="POST">
            <div class="field" id="nameField">
                <span>Your Name</span>
                <div class="field-row">
                    <img src="{{url_for('static', filename='resources/user.png')}}" alt="name">
                    <input id="nameInput" type="text" name="name"  placeholder="Name" class="modal-input">
                </div>
            </div>
            <div class="field" id="emailField">
                <span>Your Email</span>
                <div class="field-row">
                    <img src="{{url_for('static', filename='resources/email.png')}}" alt="email">
                    <input id="emailInput" type="email" name="email" placeholder="Email" required class="modal-input">
                </div>
            </div>
            <div class="field" id="passwordField">
                <span>Password</span>
                <div class="field-row">
                    <img src="{{url_for('static', filename='resources/password.png')}}" alt="password">
                    <input id="passwordInput" type="password" name="password" placeholder="Password" required class="modal-input">
                    <button type="button" id="togglePassword" class="view-password-btn" data-eye-open="{{ url_for('static', filename='resources/eye-open.png') }}" data-eye-closed="{{ url_for('static', filename='resources/eye-closed.png') }}">
                        <img src="{{ url_for('static', filename='resources/eye-closed.png') }}" alt="toggle">
                    </button>
                </div>
            </div>
            
            <p id="ErrorMessage"></p>
            <div class="modal-actions">
                <button type="submit" id="registerBtn" class="modal-btn">Continue</button>
                <div id="loginField">
                    <span>Already have an account?</span>
                    <button type="submit" id="loginBtn" class="modal-btn"><u>Log in</u></button>
                </div>
            </div>
        </form>

        <div class="modal-divider">OR</div>

        <!-- Google OAuth button -->
        <form method="POST" action="{{ url_for('auth.landing_page') }}">
            <button type="submit" class="modal-btn google-login-btn">
                <img src="{{ url_for('static', filename='resources/google-icon-logo-svgrepo-com.svg') }}" alt="google">
                Continue with Google
            </button>
        </form>
    </div>
</div>
