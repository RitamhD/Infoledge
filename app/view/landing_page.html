{% extends "base.html" %}

{% block title %}InfoLedge{% endblock title %}

{% block content %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landingpage_style.css') }}">

    <div class="header finisher-header">
        <div class="left-section">
            <header>
                <h1>
                    <img class="pen" src="{{ url_for('static', filename='resources/pen-draw.gif') }}" alt="Pen-draw-gif">
                    info<span>Ledge</span>
                    <img class="hat" src="{{ url_for('static', filename='resources/hat.png') }}" alt="scholar-hat">
                </h1>
            </header>            
            <div class="get_started">
                <button id="getStartedBtn">GET STARTED</button>
            </div>
        </div>
        
        <div class= "header right-section"> 
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/finisher-header.es5.min.js') }}" type="text/javascript"></script>
    <script type="text/javascript">
        new FinisherHeader({
        "count": 4,
        "size": {
            "min": 500,
            "max": 1500,
            "pulse": 0
        },
        "speed": {
            "x": {
            "min": 0,
            "max": 0.2
            },
            "y": {
            "min": 0,
            "max": 0
            }
        },
        "colors": {
            "background": "#000000",
            "particles": [
            "#ffc100"
            ]
        },
        "blending": "lighten",
        "opacity": {
            "center": 0,
            "edge": 0.15
        },
        "skew": 0,
        "shapes": [
            "s"
        ]
        });
    </script>

{% endblock content %}
