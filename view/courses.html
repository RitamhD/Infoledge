{% extends 'base.html' %}

{% block content %}
<!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">    -->
<link rel="stylesheet" href="{{ url_for('static', filename='courses.css') }}">

<div>
    <h2>Search your favourite courses</h2>
    <form action="{{ url_for('courses') }}" method="POST">
        <input id="search_field" type="text" name="query" placeholder="Search here...(eg. Python, Java, MySql etc.)" required>
        <button id="search-button" type="submit" name="action" value="search_courses">Search</button>
    </form>
</div>

<div id="videoContainer">
    {% if not videos %}
        <p>No courses found</p>
    {% endif %}
    {% for video in videos %}
        <div class="card" style="width: 18rem;">
            <img class="card-img-top" src="{{ video.image_url }}" alt="Card image cap">
            <div class="card-body">
                <p class="card-text">{{ video.title }}</p>
                <button id="{{ video.id }}" class="viewButton"><a href="{{ video.video_url }}" target="_blank">View</a></button>
            </div>
        </div>
    {% endfor %}
</div>


<script>
    document.addEventListener('DOMContentLoaded', function() {
        var input = document.getElementById('search_field');
        input.oninvalid = function(event) {
            event.target.setCustomValidity('Please enter a field name (e.g. Python, Java, MySQL, etc.)');
        };
        input.oninput = function(event) {
            event.target.setCustomValidity('');
        };
    });
</script>
<!-- <script src="{{ url_for('static', filename='script.js') }}"></script> -->
{% endblock %}
